[package]
name = "rt-p2p-protocol"
version = "0.1.0"
edition = "2024"
description = "Clean-slate P2P wire protocol (protobuf/prost) for forwarder/receiver iroh transport"

[lints]
workspace = true

[dependencies]
bytes = "1"
prost = "0.14"
thiserror = "2"

[dev-dependencies]
rt-iroh = { path = "../rt-iroh" }
tokio = { version = "1", features = ["full"] }
