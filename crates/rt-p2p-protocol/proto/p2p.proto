syntax = "proto3";

// Clean-slate P2P wire protocol for the forwarder <-> receiver iroh transport.
//
// `C2F` = client (receiver) -> forwarder, `F2C` = forwarder -> client (receiver).
// The protocol is split into a control plane and a data plane; each direction
// has an envelope message with a `oneof` covering the messages valid for that
// direction.
package rusty_timer.p2p.v1;

// ---------------------------------------------------------------------------
// Control-plane messages
// ---------------------------------------------------------------------------

// Initial handshake sent by the receiver to the forwarder.
//
// Identity is established by the iroh EndpointId at the transport layer; Hello
// carries no receiver IDs or bearer tokens.
message Hello {
  // Lowest protocol minor version the client can speak.
  uint32 min_minor = 1;
  // Highest protocol minor version the client can speak. The forwarder picks a
  // version from the inclusive [min_minor, max_minor] range it also supports.
  uint32 max_minor = 2;
  // Optional capability tokens advertised by the client.
  repeated string capabilities = 3;
  // Largest encoded frame the client is willing to receive, in bytes.
  uint32 max_frame_bytes = 4;
  // Catalog generation the client last observed (0 if unknown).
  uint64 catalog_generation = 5;
}

// Handshake acknowledgement sent by the forwarder.
message HelloOk {
  // Protocol minor version the forwarder agreed to speak.
  uint32 protocol_minor = 1;
  // Capability tokens the forwarder supports.
  repeated string capabilities = 2;
  // Heartbeat (ping) interval the forwarder expects, in seconds.
  uint32 heartbeat_interval_secs = 3;
  // Maximum number of records the forwarder will pack into one EventBatch.
  uint32 max_batch_size = 4;
  // Maximum encoded frame size in bytes.
  uint32 max_frame_bytes = 5;
  // Current generation of the stream catalog (monotonic).
  uint64 catalog_generation = 6;
}

// A single stream advertised in the catalog.
message StreamEntry {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  string display_name = 2;
  string network_addr = 3;
  bool reader_connected = 4;
  string hardware_reader_id = 5;
}

// Snapshot of all streams the forwarder exposes.
message StreamCatalog {
  // Monotonic generation; matches HelloOk.catalog_generation at open time.
  uint64 generation = 1;
  repeated StreamEntry entries = 2;
}

// Request to perform a control action against a reader.
message ReaderControlRequest {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  // Action verb (e.g. "connect", "disconnect", "download").
  string command = 2;
  // Correlation id echoed in the matching ReaderControlResponse.
  string request_id = 3;
}

// Result of a ReaderControlRequest.
message ReaderControlResponse {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  string request_id = 2;
  bool success = 3;
  string message = 4;
}

// Connection/liveness status for a reader.
message ReaderStatus {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  bool connected = 2;
  // Human/machine readable state token (e.g. "online", "reconnecting").
  string state = 3;
  // Wall-clock time of the last observed read, in unix milliseconds.
  int64 last_read_unix_ms = 4;
}

// Static descriptive information about a reader.
message ReaderInfo {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  string hardware_reader_id = 2;
  string firmware_version = 3;
  string model = 4;
}

// Progress of an in-flight download (e.g. backup retrieval).
message DownloadProgress {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  uint64 downloaded_bytes = 2;
  uint64 total_bytes = 3;
}

// Uninterruptible power supply status reported by the forwarder host.
message UpsStatus {
  bool on_battery = 1;
  uint32 battery_percent = 2;
  int32 runtime_seconds = 3;
}

// Server clock broadcast used by clients for clock alignment.
message SyncClock {
  int64 server_unix_ms = 1;
}

// Liveness probe.
message Ping {
  uint64 nonce = 1;
}

// Liveness response echoing the Ping nonce.
message Pong {
  uint64 nonce = 1;
}

// Out-of-band error report on the control plane.
message ProtocolError {
  uint32 code = 1;
  string message = 2;
  // True if the client may retry the failed operation.
  bool retryable = 3;
  // Stream the error pertains to, if any: a UUID encoded as 16 bytes.
  optional bytes stream_id = 4;
}

// ---------------------------------------------------------------------------
// Data-plane messages
// ---------------------------------------------------------------------------

// How a subscription should be served.
enum SubscribeMode {
  SUBSCRIBE_MODE_UNSPECIFIED = 0;
  // Deliver only new reads from the live tail.
  SUBSCRIBE_MODE_LIVE = 1;
  // Replay historical reads after `after_seq`, then continue live.
  SUBSCRIBE_MODE_REPLAY = 2;
}

// Request to subscribe to a stream's read events.
message DataSubscribe {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  // Deliver records with seq strictly greater than this value.
  uint64 after_seq = 2;
  SubscribeMode mode = 3;
}

// Acknowledgement that a subscription was opened.
message SubscribeOk {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  // Lowest seq currently retained and replayable.
  uint64 earliest_available_seq = 2;
  // Highest seq present at the moment the subscription opened.
  uint64 latest_seq_at_open = 3;
}

// A single chip read.
message ReadRecord {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  uint64 seq = 2;
  uint64 epoch = 3;
  bytes raw_frame = 4;
  // Classification of the read (e.g. "chip", "gun", "manual").
  string read_kind = 5;
  // Reader-reported timestamp (unix milliseconds, reader clock).
  int64 reader_timestamp = 6;
  // Forwarder receive time (unix milliseconds, forwarder clock).
  int64 received_unix_ms = 7;
}

// A batch of read records.
message EventBatch {
  repeated ReadRecord records = 1;
  // True when these records are part of a historical replay.
  bool replay = 2;
}

// Client acknowledgement of records processed up to and including `through_seq`.
message Ack {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  uint64 through_seq = 2;
}

// Forwarder notice that the client has caught up to the live tail.
message CaughtUp {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  uint64 through_seq = 2;
}

// Forwarder notice that requested data is no longer available.
message GapNotice {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  uint64 requested_after_seq = 2;
  uint64 earliest_available_seq = 3;
  uint64 latest_available_seq = 4;
  string reason = 5;
}

// Notice that a new stream epoch has begun (e.g. reader restart).
message StreamEpochStarted {
  // Stream identifier: a UUID encoded as 16 bytes.
  bytes stream_id = 1;
  uint64 epoch = 2;
  uint64 start_seq = 3;
  string reason = 4;
}

// ---------------------------------------------------------------------------
// Directional envelopes
// ---------------------------------------------------------------------------

// Control plane, client (receiver) -> forwarder.
message ControlC2F {
  oneof msg {
    Hello hello = 1;
    ReaderControlRequest reader_control_request = 2;
    Ping ping = 3;
    Pong pong = 4;
  }
}

// Control plane, forwarder -> client (receiver).
message ControlF2C {
  oneof msg {
    HelloOk hello_ok = 1;
    StreamCatalog stream_catalog = 2;
    ReaderControlResponse reader_control_response = 3;
    ReaderStatus reader_status = 4;
    ReaderInfo reader_info = 5;
    DownloadProgress download_progress = 6;
    UpsStatus ups_status = 7;
    SyncClock sync_clock = 8;
    Ping ping = 9;
    Pong pong = 10;
    ProtocolError protocol_error = 11;
  }
}

// Data plane, client (receiver) -> forwarder.
message DataC2F {
  oneof msg {
    DataSubscribe data_subscribe = 1;
    Ack ack = 2;
  }
}

// Data plane, forwarder -> client (receiver).
message DataF2C {
  oneof msg {
    SubscribeOk subscribe_ok = 1;
    EventBatch event_batch = 2;
    CaughtUp caught_up = 3;
    GapNotice gap_notice = 4;
    StreamEpochStarted stream_epoch_started = 5;
  }
}
