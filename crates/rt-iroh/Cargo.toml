[package]
name = "rt-iroh"
version = "0.1.0"
edition = "2024"
description = "Thin shared iroh endpoint wrapper for Rusty Timer P2P transport"

[lints]
workspace = true

[dependencies]
iroh = "=1.3.0"
thiserror = "2"

[dev-dependencies]
iroh = { version = "=1.3.0", features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
