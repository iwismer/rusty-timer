name: P2P E2E

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  full-stack:
    name: Full-stack + bridge agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: p2p-e2e-${{ matrix.os }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Run deterministic backend E2E
        run: uv run scripts/e2e/run_stack.py

      - name: Run bridge-agent E2E and emit artifacts
        run: |
          mkdir -p "${RUNNER_TEMP}/rt-bridge-agent-artifacts"
          uv run scripts/e2e/agent_ui/run_bridge_goal.py --artifacts-dir "${RUNNER_TEMP}/rt-bridge-agent-artifacts"

      - name: Upload bridge-agent artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-agent-${{ matrix.os }}
          path: ${{ runner.temp }}/rt-bridge-agent-artifacts
          if-no-files-found: warn

  connectivity-chaos:
    name: Connectivity chaos (non-PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: p2p-chaos-${{ runner.os }}

      - name: Local iroh relay smoke and loss fallback
        run: cargo test -p rt-iroh relay -- --ignored --nocapture

      - name: Partition fault shim
        run: cargo test -p rt-test-utils --test p2p_harness p2p_harness_partition_suppresses_inbound_acks -- --nocapture

      - name: Receiver reconnect storm
        run: cargo test -p receiver --lib reconnect_storm_resumes_without_duplicates -- --nocapture
