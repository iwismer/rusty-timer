name: Rust CI

on:
  push:
    branches: [master]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/*.md"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "scripts/e2e/**"
      - "scripts/tests/**"
      - "scripts/validate-packaging.sh"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/*.md"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "scripts/e2e/**"
      - "scripts/tests/**"
      - "scripts/validate-packaging.sh"
      - ".github/workflows/*.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-unit:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Match the local pre-commit posture for now: receiver-tauri is a shipped
      # desktop binary that needs platform WebView dependencies, and the
      # workspace still has pre-existing pedantic warnings outside the P2P
      # changes. Restore `-- -D warnings` once that baseline is clean.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude receiver-tauri

      - name: Run library tests
        run: cargo test --workspace --lib

      - name: Run repository script tests
        run: >-
          python -m unittest
          scripts/tests/test_cutover_cleanup.py
          scripts/tests/test_release.py
          scripts/tests/test_sbc_cloud_init.py

      - name: Validate packaging layout
        run: bash scripts/validate-packaging.sh

  receiver-windows-lib:
    name: Receiver library (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test receiver library
        run: cargo test -p receiver --lib

  p2p-seam-integration:
    name: P2P seam/integration (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: p2p-seam-${{ matrix.name }}

      - name: Run protocol and iroh loopback seams
        run: |
          cargo test -p rt-p2p-protocol --tests
          cargo test -p rt-test-utils --tests
          cargo test -p rt-iroh --lib

      - name: Run no-Docker data-plane integration tests
        run: |
          # This lane gates the P2P data plane without Docker; browser-driven
          # full-stack scenarios remain in the nightly E2E workflow.
          cargo test -p forwarder --tests
          cargo test -p receiver --test p2p_runtime
          cargo test -p receiver --test headless
          cargo test -p receiver --test local_proxy
          cargo test -p receiver --features test-bridge --lib control_bridge
          cargo test -p receiver --features test-bridge --test headless
          cargo test -p server --lib
