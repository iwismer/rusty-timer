[workspace]
members = [
    ".",
    "crates/emulator",
    "crates/ipico-core",
    "crates/rt-screen",
    "crates/rt-iroh",
    "crates/rt-ui-http",
    "crates/rt-domain",
    "crates/rt-p2p-protocol",
    "crates/rt-test-utils",
    "crates/timer-core",
    "crates/rt-updater",
    "crates/rt-ui-log",
    "services/forwarder",
    "services/receiver",
    "services/server",
    "services/streamer",
    "services/emulator",
    "apps/receiver-ui/src-tauri",
]
resolver = "2"

[profile.release]
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# These are commonly too noisy in this codebase — suppress
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[package]
name = "rusty-timer"
version = "1.0.0"
authors = ["iwismer <isaac@iwismer.ca>"]
edition = "2024"
homepage = "https://github.com/iwismer/rusty-timer"

[lib]
name = "rusty_timer"
path = "src/lib.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rt-test-utils = { path = "crates/rt-test-utils" }
receiver = { path = "services/receiver" }
tempfile = "3"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
forwarder = { path = "services/forwarder" }
ipico-core = { path = "crates/ipico-core" }
serde_json = "1"
