[package]
name = "thin-node"
version = "0.1.0"
edition = "2024"

[features]
embed-ui = ["dep:rust-embed", "rt-ui-http/embed-ui"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rt-ui-http = { path = "../../crates/rt-ui-http" }
rust-embed = { version = "8", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = "0.5"

[lints]
workspace = true
